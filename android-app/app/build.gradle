plugins {
    id 'com.android.application'
}

android {
    namespace 'ph.edu.hnhs.hnhs360'
    compileSdk 34

    defaultConfig {
        applicationId 'ph.edu.hnhs.hnhs360'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
