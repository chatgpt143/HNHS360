<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3d75">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>HNHS360</title>
<style>body{margin:0;background:#eef4fb;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#17304d}.loading{min-height:100vh;display:grid;place-items:center;text-align:center}.loading b{font-size:28px;color:#0f3d75}.loading div{margin-top:6px;color:#6b778c}</style>
</head>
<body>
<div class="loading"><section><b>HNHS360</b><div>Loading Smart Access...</div></section></div>
<script>
const BUILD='20260908e';
fetch('./app.html?v='+BUILD,{cache:'no-store'})
  .then(r=>{if(!r.ok)throw new Error('Unable to load HNHS360');return r.text()})
  .then(html=>{
    const extras='<script src="./teacher.js?v='+BUILD+'"><\/script><script src="./management.js?v='+BUILD+'"><\/script><script src="./admin-entities.js?v='+BUILD+'"><\/script>';
    const patched=html.replace(/<\/body>/i,extras+'</body>');
    document.open();document.write(patched);document.close();
  })
  .catch(e=>{document.body.innerHTML='<div class="loading"><section><b>HNHS360</b><div>'+String(e.message||e)+'</div></section></div>'});
</script>
</body>
</html>
