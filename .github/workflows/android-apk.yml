name: Build HNHS360 Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: hnhs360-android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK file
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk android-app/app/build/outputs/apk/debug/HNHS360-v1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HNHS360-Android-v1.0.0
          path: android-app/app/build/outputs/apk/debug/HNHS360-v1.0.0.apk
          if-no-files-found: error

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK='android-app/app/build/outputs/apk/debug/HNHS360-v1.0.0.apk'
          TAG='android-v1.0.0'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK#HNHS360-v1.0.0.apk" \
              --target "$GITHUB_SHA" \
              --title 'HNHS360 Android v1.0.0' \
              --notes 'HNHS360 Android app for Subject Teachers and Learners. Requires internet access and uses the live HNHS360 clearance system.'
          fi
