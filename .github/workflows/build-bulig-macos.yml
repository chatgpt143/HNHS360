name: Build BULIG macOS

on:
  push:
    branches:
      - bulig-macos-build
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Prepare app resources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          base64 -D -i bulig-build/BuligLogo.jpg.b64 -o build/BuligLogo.jpg
          base64 -D -i bulig-build/DepEdBukidnonSeal.jpg.b64 -o build/DepEdBukidnonSeal.jpg
          base64 -D -i bulig-build/ReportBuligLogo.jpg.b64 -o build/ReportBuligLogo.jpg

          rm -rf build/BuligIcon.iconset
          mkdir -p build/BuligIcon.iconset
          sips -s format png -z 16 16 build/BuligLogo.jpg --out build/BuligIcon.iconset/icon_16x16.png
          sips -s format png -z 32 32 build/BuligLogo.jpg --out build/BuligIcon.iconset/icon_16x16@2x.png
          sips -s format png -z 32 32 build/BuligLogo.jpg --out build/BuligIcon.iconset/icon_32x32.png
          sips -s format png -z 64 64 build/BuligLogo.jpg --out build/BuligIcon.iconset/icon_32x32@2x.png
          sips -s format png -z 128 128 build/BuligLogo.jpg --out build/BuligIcon.iconset/icon_128x128.png
          sips -s format png -z 256 256 build/BuligLogo.jpg --out build/BuligIcon.iconset/icon_128x128@2x.png
          sips -s format png -z 256 256 build/BuligLogo.jpg --out build/BuligIcon.iconset/icon_256x256.png
          sips -s format png -z 512 512 build/BuligLogo.jpg --out build/BuligIcon.iconset/icon_256x256@2x.png
          sips -s format png -z 512 512 build/BuligLogo.jpg --out build/BuligIcon.iconset/icon_512x512.png
          sips -s format png -z 1024 1024 build/BuligLogo.jpg --out build/BuligIcon.iconset/icon_512x512@2x.png
          iconutil -c icns build/BuligIcon.iconset -o build/BuligIcon.icns

          # Vendor SheetJS Community Edition for offline SF1 Excel import (.xls/.xlsx/.xlsm)
          mkdir -p build/sheetjs
          curl --fail --location --retry 3 --silent --show-error \
            https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz \
            -o build/xlsx-0.20.3.tgz
          tar -xzf build/xlsx-0.20.3.tgz -C build/sheetjs
          test -f build/sheetjs/package/dist/xlsx.full.min.js

      - name: Compile universal native app
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          SRC="bulig-build/BULIGApp.swift"

          xcrun swiftc -swift-version 5 -O -parse-as-library \
            -target arm64-apple-macos13.0 -sdk "$SDK" \
            -framework SwiftUI -framework AppKit -framework WebKit -framework JavaScriptCore -framework PDFKit \
            "$SRC" -o build/BULIG-arm64

          xcrun swiftc -swift-version 5 -O -parse-as-library \
            -target x86_64-apple-macos13.0 -sdk "$SDK" \
            -framework SwiftUI -framework AppKit -framework WebKit -framework JavaScriptCore -framework PDFKit \
            "$SRC" -o build/BULIG-x86_64

          lipo -create build/BULIG-arm64 build/BULIG-x86_64 -output build/BULIGRMSTeacher
          lipo -info build/BULIGRMSTeacher

      - name: Assemble app bundle
        shell: bash
        run: |
          set -euxo pipefail
          APP="dist/BULIG RMS Teacher.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/BULIGRMSTeacher "$APP/Contents/MacOS/BULIGRMSTeacher"
          chmod +x "$APP/Contents/MacOS/BULIGRMSTeacher"
          cp build/BuligIcon.icns "$APP/Contents/Resources/BuligIcon.icns"
          cp build/BuligLogo.jpg "$APP/Contents/Resources/BuligLogo.jpg"
          cp build/DepEdBukidnonSeal.jpg "$APP/Contents/Resources/DepEdBukidnonSeal.jpg"
          cp build/ReportBuligLogo.jpg "$APP/Contents/Resources/ReportBuligLogo.jpg"
          cp build/sheetjs/package/dist/xlsx.full.min.js "$APP/Contents/Resources/xlsx.full.min.js"
          if [ -f build/sheetjs/package/LICENSE ]; then cp build/sheetjs/package/LICENSE "$APP/Contents/Resources/SheetJS-LICENSE.txt"; fi

          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleExecutable</key><string>BULIGRMSTeacher</string>
            <key>CFBundleIconFile</key><string>BuligIcon</string>
            <key>CFBundleIdentifier</key><string>ph.bukidnon.buligrms.teacher</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>BULIG RMS Teacher</string>
            <key>CFBundleDisplayName</key><string>BULIG RMS Teacher</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.19</string>
            <key>CFBundleVersion</key><string>19</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSPrincipalClass</key><string>NSApplication</string>
          </dict>
          </plist>
          PLIST

          plutil -lint "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Create DMG installer
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dmgroot
          cp -R "dist/BULIG RMS Teacher.app" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create \
            -volname "BULIG RMS Teacher" \
            -srcfolder dmgroot \
            -ov \
            -format UDZO \
            "BULIG_RMS_Teacher_Mac_v0.19.dmg"
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/BULIG RMS Teacher.app" \
            "BULIG_RMS_Teacher_Mac_v0.19_App.zip"
          ls -lh BULIG_RMS_Teacher_Mac_v0.19.dmg BULIG_RMS_Teacher_Mac_v0.19_App.zip

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BULIG-RMS-Teacher-Mac-v0.19
          path: |
            BULIG_RMS_Teacher_Mac_v0.19.dmg
            BULIG_RMS_Teacher_Mac_v0.19_App.zip
          if-no-files-found: error
          retention-days: 7

# BULIG macOS cloud build
